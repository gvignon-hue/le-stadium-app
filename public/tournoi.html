<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tournoi padel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --court:#0B5345; --court-deep:#083D33; --done:#E2F3E8; --done-line:#8CCBA4; --conn:#8A97A8; --ball:#DDEB3C; --ball-ink:#1B2400;
  --bg:#EEF2F6; --surface:#FFFFFF; --ink:#16202C; --muted:#5A6778; --line:#D3DBE5; --soft:#F5F8FB; --danger:#B3261E;
  --wa:#1F9D55;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --court:#1F8A6E; --court-deep:#0B5345; --done:#15352B; --done-line:#2E7A58; --conn:#5C6B7E; --bg:#0F1722; --surface:#172231; --ink:#E6ECF3; --muted:#93A1B3; --line:#2A384B; --soft:#1B2838; --danger:#F2867E; --wa:#35C274;
  }
}
:root[data-theme="dark"]{
  --court:#1F8A6E; --court-deep:#0B5345; --done:#15352B; --done-line:#2E7A58; --conn:#5C6B7E; --bg:#0F1722; --surface:#172231; --ink:#E6ECF3; --muted:#93A1B3; --line:#2A384B; --soft:#1B2838; --danger:#F2867E; --wa:#35C274;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;line-height:1.1;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}

header{background:var(--court);color:#fff;position:relative;overflow:hidden}
header::before{content:"";position:absolute;inset:14px 14px auto 14px;height:calc(100% - 28px);border:2px solid rgba(255,255,255,.35);border-radius:2px;pointer-events:none}

.head-in{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:28px 32px 0}
header h1{font-size:clamp(34px,6vw,56px);letter-spacing:.5px}
header .sub{opacity:.85;margin:4px 0 18px}
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-6px 0 12px}
.tbar label{font-size:13px;opacity:.85;font-weight:600}
.tbar select{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:6px;padding:6px 10px;font-size:14px;max-width:100%}
.tbar select option{color:#16202C;background:#fff}
.tbar .tb-btn{background:var(--ball);color:var(--ball-ink);border:0;border-radius:6px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:transparent;border:0;color:#fff;opacity:.75;padding:10px 16px 12px;cursor:pointer;font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600;border-bottom:4px solid transparent;white-space:nowrap}
nav button[aria-current="true"]{opacity:1;border-bottom-color:var(--ball)}
nav button:disabled{opacity:.35;cursor:default}
main{max-width:1900px;margin:0 auto;padding:28px 20px 60px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:20px}
section.card h2{font-size:26px;margin-bottom:12px}
p.help{color:var(--muted);margin:0 0 14px;max-width:70ch}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);min-width:140px}
label.f.wide{flex:1 1 320px}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:9px 10px;color:var(--ink)}
textarea{width:100%;min-height:90px;resize:vertical}
.btn{background:var(--court);color:#fff;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ball{background:var(--ball);color:var(--ball-ink)}
.btn.wa{background:var(--wa);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:14px}
.btn.icon-sm{padding:5px 10px 5px 8px;font-size:13px;display:inline-flex;align-items:center;gap:5px;border-radius:20px}
.btn.icon-sm svg{width:15px;height:15px;flex-shrink:0}
.btn.sms{background:var(--court-deep);color:#fff;text-decoration:none}
.btn.relance{background:#C9720B;color:#fff;text-decoration:none}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;border:2px dashed var(--line);border-radius:10px;padding:34px;text-align:center;cursor:pointer;background:var(--soft)}
.drop.over{border-color:var(--court)}
.msg{padding:10px 14px;border-radius:6px;background:var(--soft);border-left:4px solid var(--court);margin:12px 0}
.msg.err{border-left-color:var(--danger)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600}
tr.out td{opacity:.45;text-decoration:line-through}
.ts{display:inline-block;background:var(--ball);color:var(--ball-ink);font-weight:700;font-size:12px;padding:1px 7px;border-radius:10px;margin-right:6px;font-family:"Barlow Condensed",sans-serif;letter-spacing:.3px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Tableau */
.bracket{display:flex;gap:26px;overflow-x:auto;padding:6px 16px 14px 2px}
.round{display:flex;flex-direction:column;min-width:200px;flex:1 1 230px}
.round h3{font-size:20px;margin-bottom:10px;color:var(--court)}
.round .ms{display:flex;flex-direction:column;flex:1}
.pair{flex:1;display:flex;flex-direction:column;justify-content:space-around;position:relative}
.mw{position:relative;padding:3px 0}
.mw.cout::after,.mw.cin::before{content:"";position:absolute;top:50%;width:13px;border-top:2px solid var(--conn)}
.mw.cout::after{right:-13px}.mw.cin::before{left:-13px}
.pair.v2::after,.pair.vt::after,.pair.vb::after{content:"";position:absolute;right:-13px;border-right:2px solid var(--conn)}
.pair.v2::after{top:25%;bottom:25%}.pair.vt::after{top:25%;bottom:50%}.pair.vb::after{top:50%;bottom:25%}
.ghostm{visibility:hidden}
.side .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.score.sp{border-left:1px solid var(--line);border-top:0}
.match input.score,.score-side,.score.sp,.score-p{width:34px;flex-shrink:0;box-sizing:border-box}
.side{height:30px}
.score-p{text-align:center;font-weight:700;padding:3px;border-left:1px solid var(--line);border-top:0;font-size:12px;display:flex;align-items:center;justify-content:center}
#pdfwrap{position:fixed;left:-20000px;top:0;width:1500px;background:#fff;padding:10px;
  --bg:#fff;--surface:#fff;--ink:#16202C;--muted:#5A6778;--line:#C9D3DE;--soft:#F5F8FB;--court:#0B5345;--done:#E2F3E8;--done-line:#8CCBA4;--conn:#5A6778;color:#16202C}
#pdfwrap .ph{display:flex;align-items:center;gap:16px;background:#0B5345;color:#fff;padding:14px 20px}
#pdfwrap .ph img{height:60px}#pdfwrap .ph h1{font-size:32px}
#pdfwrap .bracket{overflow:visible}
.match{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.match.next{background:#FFDFAD;border:2px solid #E8860B}
.match.started{background:#FBF191;border:2px solid #C9A227}
.mmain{display:flex;flex-direction:column}
.mnum{display:flex;align-items:center;gap:4px;cursor:pointer}
.mnum input{cursor:pointer}
.siderow{display:flex;align-items:stretch}
.siderow .side{flex:1;min-width:0}
.match.bye{opacity:.55;border-style:dashed}
.match .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ink);padding:5px 8px 5px 10px;background:var(--soft);border-bottom:1px solid var(--line)}
.match .meta select,.match .meta input{font-weight:700;padding:3px 5px;font-size:14px}
.match .meta input.hm{width:64px}
.match.done{background:#B8E6C4;border:2px solid #2E9950}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lg-chip{padding:5px 12px;border-radius:6px;font-size:13px;font-weight:700}
.lg-chip.done{background:#B8E6C4;border:2px solid #2E9950;color:#15352B}
.lg-chip.started{background:#FBF191;border:2px solid #C9A227;color:#4A3B00}
.lg-chip.next{background:#FFDFAD;border:2px solid #E8860B;color:#5C3300}
.match.done .meta{background:transparent}
.hmspin{display:inline-flex;align-items:stretch}
.hmspin input.hm{border-radius:6px 0 0 6px;width:80px}
.spin{display:flex;flex-direction:column;border:1px solid var(--line);border-left:0;border-radius:0 6px 6px 0;overflow:hidden}
.spin button{flex:1;border:0;background:var(--soft);padding:0 7px;font-size:9px;line-height:1;cursor:pointer;color:var(--ink)}
.spin button+button{border-top:1px solid var(--line)}
.spin button:hover{background:var(--line)}
.match .when{display:flex;align-items:center;gap:6px}
.match input.score{font-weight:600;text-align:center;letter-spacing:.5px}
.match.done input.score,.match.done .score-side{background:transparent}
.side.win::after{content:"✓";font-weight:700;color:var(--court)}
.pbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer;margin:2px 0}
.pbtn.win{background:var(--done);border-color:var(--done-line);font-weight:700}
.pbtn:disabled{border-color:transparent;cursor:default;padding-left:0}
.side.dragover{outline:2px dashed var(--court);outline-offset:-2px;background:var(--soft)}
.side[draggable=true]{cursor:grab}
tr.done td{background:var(--done)}
#logo{height:130px;width:auto;object-fit:contain;display:block;flex:none}
.brand{display:flex;align-items:center;gap:28px;margin-bottom:18px}
.brand .info{min-width:0}
.brand .sub{margin:6px 0 4px;font-size:18px}
@media (max-width:640px){#logo{height:84px}.brand{gap:16px}.brand .sub{font-size:15px}}
.sync{font-size:13px;opacity:.85}
.sync[data-s="ok"]::before{content:"● ";color:#7CE0A8}
.sync[data-s="err"]::before,.sync[data-s="ro"]::before{content:"● ";color:#F2B36F}
.side{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:5px 10px;text-align:left;cursor:pointer;font-size:14px;min-height:30px}
.side:last-of-type{border-bottom:0}
.side:disabled,.side[aria-disabled=true]{cursor:default}
.ts[data-tsid]{cursor:pointer}
.side[data-pid]{user-select:none}
.side.win{font-weight:700;color:var(--ink)}
.side .tbd{color:var(--muted);font-style:italic}
.match input.score,.score-side{width:34px;border:0;border-left:1px solid var(--line);border-top:0;border-radius:0;padding:4px 2px;font-size:12px;background:var(--soft);text-align:center}
.champ{margin-top:10px;padding:14px;border-radius:8px;background:var(--ball);color:var(--ball-ink);font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700}
.archives{display:flex;flex-direction:column;gap:10px}
.arc{border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.arc-h{display:flex;align-items:center;flex-wrap:wrap;gap:6px}

.pair-conv{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pair-conv:last-child{border-bottom:0}
.pair-conv .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.sent{font-size:13px;color:var(--wa);font-weight:600}
.preview{font-size:13px;color:var(--muted);grid-column:1 / -1;background:var(--soft);padding:8px 10px;border-radius:6px;white-space:pre-wrap}
td input[type=time]{width:110px} td input[type=number]{width:70px}

.tabs-class{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:20px}
.tabs-class section.card{margin:0}

.pools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:18px}
.pool-in{padding:12px 14px}
.pool-ms{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
table.stand td,table.stand th{padding:6px 8px}
table.stand tr.qual td{background:var(--done);font-weight:600}
.group{display:flex;flex-wrap:wrap;gap:18px 40px;align-items:flex-start}
#tableauClassement section.card{overflow-x:auto;-webkit-overflow-scrolling:touch}
.branch{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.branch .group{margin-left:28px;padding-left:16px;border-left:2px solid var(--line)}
.subtab{min-width:0;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.subtab .bracket{padding:12px 16px}
.subtitle{font-size:19px;color:#fff;background:var(--court);margin:0;padding:8px 14px;text-align:center}
.subtab .round{min-width:240px;flex:1 1 280px}
@media print{.card{page-break-inside:avoid}}
.places{columns:2 240px;column-gap:30px;margin:0;padding:0;list-style:none}
.places li{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);break-inside:avoid}
.places .pl{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;min-width:44px;color:var(--court)}
input.hm{width:90px}
@media print{.tabs-class{display:block}.tabs-class section.card{page-break-inside:avoid;margin-bottom:16px}}
@media (max-width:640px){
  .head-in{padding:24px 20px 0} main{padding:20px 12px 50px} section.card{padding:16px}
  .pair-conv{grid-template-columns:1fr} .pair-conv .acts{justify-content:flex-start}
}
@media print{
  header nav, .noprint{display:none!important}
  header{background:none;color:#000} header::before,header::after{display:none}
  body{background:#fff;color:#000}
  section.card{border:0;padding:0}
  .bracket{overflow:visible;flex-wrap:nowrap}
  .match .meta select,.match .meta input{border:0;background:none;appearance:none}
}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="brand"><img id="logo" alt="Le Stadium">
      <div class="info"><h1 id="title">Tournoi padel</h1>
        <div class="sub" id="subtitle">Importez la liste des participants exportée de MOJA pour commencer.</div>
        <div id="sync" class="sync"></div></div></div>
    <div id="tbar" class="tbar noprint"></div>
    <nav id="nav"></nav>
  </div>
</header>
<main id="app"></main>

/* Positions des têtes de série : TS1 en bas, TS2 en haut, puis chaque autre tête de série dans un bloc libre du tableau.
   Dans la moitié haute elle est placée en haut de son bloc (donc en haut du match), dans la moitié basse en bas du bloc. */
function seedPositions(size,noShuffle){
  const rank=[size-1,0],placed=[size-1,0];
  for(let L=2;2**(L-1)<size;L++){
    const bs=size/2**L,g=[];
    for(let b=0;b<2**L;b++){
      const s=b*bs,e=s+bs-1;
      if(placed.some(q=>q>=s&&q<=e))continue;
      g.push(s+e<size-1?s:e);
    }
    placed.push(...g);rank.push(...(noShuffle?g:shuffle(g)));
  }
  return rank;
}

const autoSeeds=size=>Math.max(2,size/4);

function poolCfg(n){
  const s=S.settings;let P=Number(s.pnum)||Math.max(2,Math.round(n/4));
  let X=Math.max(0,Number(s.pdirect)||0);
  const rest=Math.max(0,n-X),min=Math.floor(rest/Math.max(1,P));
  let Q=Number(s.pqual)||(min>=3?2:1);
  const sizes=Array.from({length:P},(_,i)=>Math.floor(rest/P)+(i<rest%P?1:0));
  const total=X+P*Q;let size=2;while(size<total)size*=2;
  let err='';
  if(P<1)err='Il faut au moins une poule.';
  else if(min<2)err='Pas assez de paires pour ce nombre de poules.';
  else if(Q>=min)err=`Avec des poules de ${min}, il faut moins de ${min} qualifiés par poule.`;
  else if(total<2)err='Le tableau final doit compter au moins 2 paires.';
  return{P,X,Q,sizes,total,size,err};
}
function roundRobin(ids){const a=ids.slice();if(a.length%2)a.push(null);const n=a.length,R=[];
  for(let r=0;r<n-1;r++){const ms=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)ms.push([x,y])}R.push(ms);a.splice(1,0,a.pop())}return R}
function makePoolDraw(){
  const ps=active(),n=ps.length,c=poolCfg(n);
  if(c.err){UI.err=c.err;return false}
  const direct=ps.slice(0,c.X),rest=ps.slice(c.X);
  const pools=Array.from({length:c.P},()=>[]);
  rest.forEach((p,i)=>{const r=Math.floor(i/c.P),k=i%c.P;pools[r%2===0?k:c.P-1-k].push(p.id)});
  const ents=[...direct.map(p=>({p:p.id,g:-1}))];
  for(let r=1;r<=c.Q;r++)pools.forEach((_,i)=>ents.push({q:[i,r],g:i}));
  const size=c.size;let byes=size-ents.length;
  const rank=seedPositions(size,true);
  const slots=Array(size).fill(undefined),where=[];
  const nSeeds=Math.min(ents.length,c.X+c.P,size/2);
  const idxAt={};
  const put=(e,pos)=>{slots[pos]=e.p?e.p:{q:e.q};where.push([e.g,pos]);idxAt[pos]=ents.indexOf(e)};
  for(let k=0;k<nSeeds;k++)put(ents[k],rank[k]);
  for(let k=0;k<nSeeds&&byes>0;k++){const nb=rank[k]^1;if(slots[nb]===undefined){slots[nb]=null;byes--}}
  const meet=(a,b)=>Math.floor(Math.log2(a^b))+1;
  // Séparer les paires d'une même poule, et opposer les meilleures entrantes aux têtes de série les plus faibles
  const best=(e,ok)=>{let bp=-1,bs=-1,bo=-2;rank.forEach(pos=>{if(!ok(pos))return;
    const sc=Math.min(99,...where.filter(w=>w[0]===e.g&&e.g>=0).map(w=>meet(w[1],pos)));
    const op=idxAt[pos^1]??-1;
    if(sc>bs||(sc===bs&&op>bo)){bs=sc;bo=op;bp=pos}});return bp};
  ents.slice(nSeeds).forEach(e=>{
    if(byes>0){const pos=best(e,x=>slots[x]===undefined&&slots[x^1]===undefined);if(pos>=0){put(e,pos);slots[pos^1]=null;byes--;return}}
    put(e,best(e,x=>slots[x]===undefined));
  });
  for(let i=0;i<size;i++)if(slots[i]===undefined)slots[i]=null;
  const pm=[];pools.forEach((pl,i)=>roundRobin(pl).forEach((ms,r)=>ms.forEach(([a,b],k)=>pm.push({id:`P${i}-${r}-${k}`,pool:i,round:r,a,b}))));
  const heads=[...direct.map(p=>p.id),...pools.map(pl=>pl[0])];
  S.draw={mode:'poules',size,slots,seeds:heads,pools,qual:c.Q,pm,winners:{},scores:{},times:{},courts:{},started:{}};
  S.sent={};save();return true;
}

  if(!idA||!idB||idA===idB){UI.err='Choisissez deux paires différentes.';return false}

  const hadResults=Object.keys(D.winners||{}).length||Object.keys(D.scores||{}).length||Object.keys(D.times||{}).length;
  if(hadResults&&!confirm('Échanger ces deux paires réinitialise les scores, heures et terrains déjà saisis. Continuer ?'))return false;
  const touchedPools=new Set();
  function place(loc,id){if(loc.type==='slot')D.slots[loc.i]=id;else{D.pools[loc.pi][loc.j]=id;touchedPools.add(loc.pi)}}

function makeDraw(){
  if(S.settings.mode==='poules')return makePoolDraw();
  const ps=active(),n=ps.length;
  if(n<2){UI.err='Il faut au moins 2 paires pour faire le tirage.';return false}
  let size=2;while(size<n)size*=2;
  const nSeeds=Math.min(n,S.settings.seeds==='auto'?autoSeeds(size):Number(S.settings.seeds));
  let byes=size-n;
  const rank=seedPositions(size);
  const slots=Array(size).fill(undefined);
  for(let k=0;k<nSeeds;k++)slots[rank[k]]=ps[k].id;
  for(let k=0;k<nSeeds&&byes>0;k++){const nb=rank[k]^1;if(slots[nb]===undefined){slots[nb]=null;byes--}}
  let u=nSeeds;
  for(let k=nSeeds;k<rank.length&&byes>0;k++){const pos=rank[k];if(slots[pos]===undefined&&slots[pos^1]===undefined){slots[pos]=ps[u++].id;slots[pos^1]=null;byes--}}
  const rest=shuffle(ps.slice(u).map(p=>p.id));
  for(let i=0;i<size;i++)if(slots[i]===undefined)slots[i]=rest.shift();
  S.draw={size,slots,seeds:ps.slice(0,nSeeds).map(p=>p.id),winners:{},scores:{},times:{},courts:{},started:{}};
  S.sent={};save();return true;
}

/* ---------- Modèle : tableau final + matchs de classement intégral ----------
   Chaque tour envoie ses vainqueurs vers les meilleures places et ses perdants
   vers un tableau de classement (9-16, 5-8, 3-4...). Source : null = exempt,
   {p} = paire, {m,t:'w'|'l'} = vainqueur/perdant d'un match. */
function model(){
  const D=S.draw,M={},list=[],tabs=[],places=[];let cnt=0;
  const isBye=src=>{if(src===null)return true;if(src.p||src.q||src.tri)return false;const m=M[src.m];return src.t==='w'?(m.byeA&&m.byeB):m.bye};
  function build(lo,ents,tab,depth,parent){
    if(ents.length===1){places.push({place:lo,src:ents[0]});return}
    const realEnts=ents.filter(e=>!isBye(e));
    if(!tab&&parent&&realEnts.length>=3&&realEnts.length%2===1&&realEnts.length<ents.length){
      const trio={lo,hi:lo+realEnts.length-1,triangular:true,entrants:realEnts,matches:[],rounds:[],main:false};
      trio.group=!parent||parent.main?trio:parent.group;
      trio.parent=parent&&!parent.main?parent:null;
      trio.early=!trio.main&&parent?(parent.main?depth===1:!!parent.early):false;
      tabs.push(trio);
      for(let i=0;i<realEnts.length;i++){places.push({place:lo+i,src:{tri:trio,idx:i}})}
      for(let i=0;i<realEnts.length;i++)for(let j=i+1;j<realEnts.length;j++){
        const m={id:'m'+(cnt++),sa:realEnts[i],sb:realEnts[j],lo,n:realEnts.length,tab:trio,depth,idx:list.length,triGroup:trio};
        m.byeA=false;m.byeB=false;m.bye=false;
        M[m.id]=m;list.push(m);trio.matches.push(m);
      }
      return;
    }
    if(!tab){tab={lo,hi:lo+ents.length-1,rounds:[],main:!tabs.length,depth0:depth};tab.group=!parent||parent.main?tab:parent.group;tab.parent=parent&&!parent.main?parent:null;tab.early=!tab.main&&parent?(parent.main?depth===1:!!parent.early):false;tabs.push(tab)}
    const round={n:ents.length,lo,matches:[]};tab.rounds.push(round);
    const W=[],L=[];
    for(let i=0;i<ents.length;i+=2){
      const m={id:'m'+(cnt++),sa:ents[i],sb:ents[i+1],lo,n:ents.length,tab,depth,idx:list.length};
      m.byeA=isBye(m.sa);m.byeB=isBye(m.sb);m.bye=m.byeA||m.byeB;
      M[m.id]=m;list.push(m);round.matches.push(m);
      W.push({m:m.id,t:'w'});L.push({m:m.id,t:'l'});
    }
    build(lo,W,tab,depth+1);
    build(lo+ents.length/2,L,null,depth+1,tab);
  }
  build(1,D.slots.map(x=>x===null?null:typeof x==='string'?{p:x}:{q:x.q}),null,0);

  // Poules
  const F=fmt();
  const pms=(D.pm||[]).map((x,i)=>{const m={id:x.id,pool:x.pool,round:x.round,a:x.a,b:x.b,sa:{p:x.a},sb:{p:x.b},isPool:true,lo:0,idx:-1000+i};
    let w=D.winners[m.id];if(w!==m.a&&w!==m.b){if(w)delete D.winners[m.id];w=''}m.winner=w;m.loser=w?(w===m.a?m.b:m.a):'';M[m.id]=m;return m});
  const stand=(D.pools||[]).map((ids,i)=>{
    const ms=pms.filter(m=>m.pool===i),st={};
    ids.forEach(id=>st[id]={id,v:0,d:0,sw:0,sl:0,gw:0,gl:0});
    ms.forEach(m=>{if(!m.winner)return;const A=st[m.a],B=st[m.b],W=m.winner===m.a?A:B,L=W===A?B:A;W.v++;L.d++;
      parseScore(D.scores[m.id]).sets.forEach(([x,y],k)=>{x=+x;y=+y;if(x>y){A.sw++;B.sl++}else if(y>x){B.sw++;A.sl++}
        if(F.sets[k]!=='TB'){A.gw+=x;A.gl+=y;B.gw+=y;B.gl+=x}})});
    const pw=id=>byId(id)?.poids??1e9;
    const h2h=(x,y)=>{const m=ms.find(m=>(m.a===x&&m.b===y)||(m.a===y&&m.b===x));return m&&m.winner?(m.winner===x?-1:1):0};
    const rows=Object.values(st).sort((x,y)=>y.v-x.v||0);
    const out=[];let i0=0;
    while(i0<rows.length){let j=i0;while(j<rows.length&&rows[j].v===rows[i0].v)j++;const g=rows.slice(i0,j);
      if(g.length===2)g.sort((x,y)=>h2h(x.id,y.id)||((y.sw-y.sl)-(x.sw-x.sl))||((y.gw-y.gl)-(x.gw-x.gl))||pw(x.id)-pw(y.id));
      else g.sort((x,y)=>((y.sw-y.sl)-(x.sw-x.sl))||((y.gw-y.gl)-(x.gw-x.gl))||pw(x.id)-pw(y.id));
      out.push(...g);i0=j}
    return{rows:out,complete:ms.length>0&&ms.every(m=>m.winner),ms};
  });

  // Résolution des paires ('' = pas encore connu, null = exempt)
  const res=src=>{if(src===null)return null;if(src.p)return src.p;if(src.q){const st=stand[src.q[0]];return st&&st.complete?(st.rows[src.q[1]-1]?.id||''):''}if(src.tri){const t=src.tri;return t.complete&&t.rows[src.idx]?t.rows[src.idx].id:''}const m=M[src.m];return src.t==='w'?m.winner:m.loser};
  list.forEach(m=>{
    m.a=res(m.sa);m.b=res(m.sb);
    if(m.bye){m.winner=m.byeA&&m.byeB?null:(m.byeA?m.b:m.a);m.loser=null;return}
    let w=D.winners[m.id];
    if(!(m.a&&m.b&&(w===m.a||w===m.b))){if(w)delete D.winners[m.id];w=''}
    m.winner=w;m.loser=w?(w===m.a?m.b:m.a):'';
  });

  // Classement des petits groupes "poule à N" (quand le nombre réel de paires restantes est impair) — règle FFT : victoires, puis confrontation directe (2 ex-æquo) ou différence de sets puis de jeux (3+ ex-æquo)
  tabs.filter(t=>t.triangular).forEach(trio=>{
    const resolved=trio.entrants.map(res);
    if(resolved.some(id=>!id)){trio.complete=false;trio.rows=[];return}
    const st={};resolved.forEach(id=>st[id]={id,v:0,d:0,sw:0,sl:0,gw:0,gl:0});
    const ms=trio.matches;
    ms.forEach(m=>{
      if(!m.winner)return;
      const A=st[m.a],B=st[m.b],W=m.winner===m.a?A:B,L=W===A?B:A;W.v++;L.d++;
      parseScore(D.scores[m.id]).sets.forEach(([x,y],k)=>{x=+x;y=+y;if(x>y){A.sw++;B.sl++}else if(y>x){B.sw++;A.sl++}
        if(F.sets[k]!=='TB'){A.gw+=x;A.gl+=y;B.gw+=y;B.gl+=x}});
    });
    const pw=id=>byId(id)?.poids??1e9;
    const h2h=(x,y)=>{const m=ms.find(mm=>(mm.a===x&&mm.b===y)||(mm.a===y&&mm.b===x));return m&&m.winner?(m.winner===x?-1:1):0};
    const sorted=Object.values(st).sort((x,y)=>y.v-x.v||0);
    const rows=[];let i0=0;
    while(i0<sorted.length){let j=i0;while(j<sorted.length&&sorted[j].v===sorted[i0].v)j++;const g=sorted.slice(i0,j);
      if(g.length===2)g.sort((x,y)=>h2h(x.id,y.id)||((y.sw-y.sl)-(x.sw-x.sl))||((y.gw-y.gl)-(x.gw-x.gl))||pw(x.id)-pw(y.id));
      else g.sort((x,y)=>((y.sw-y.sl)-(x.sw-x.sl))||((y.gw-y.gl)-(x.gw-x.gl))||pw(x.id)-pw(y.id));
      rows.push(...g);i0=j}
    const complete=ms.every(m=>m.winner);
    trio.complete=complete;trio.rows=rows;
  });

  // Planning : chaque match démarre dès qu'un terrain est libre et que ses paires ont eu leur repos
  const C=Math.max(1,Number(S.settings.courts)||1),dur=Number(S.settings.dur)||45,rest=Number(S.settings.rest)||0,start=toMin(S.settings.start);
  const real=[...pms,...list.filter(m=>!m.bye)];
  const poolEnd=i=>Math.max(start,...pms.filter(m=>m.pool===i&&m.time!=null).map(m=>m.time+dur));
  const ready=src=>{
    if(src===null)return -Infinity;if(src.p)return start;if(src.q)return poolEnd(src.q[0])+rest;
    const m=M[src.m];
    if(m.bye)return Math.max(ready(m.sa),ready(m.sb));
    return m.time==null?undefined:m.time+dur+rest;
  };
  // Phases (ordre des matchs). Chaque phase attend la fin de la précédente. Pour un tableau de 16 :
  //  0 : 1/8 · 1 : classement 9/16 · 2 : 1/4 · 3 : classement 9/12 et 13/16 ·
  //  4 : 1/2 + classement 5/8 · 5 : classement 9/10, 11/12, 13/14, 15/16 · 6 : finale + 3/4, 5/6, 7/8.
  // Règle : phase = 2 x (nombre de matchs déjà joués), moins 1 pour les paires qui ont perdu leur tout premier match.
  const off=pms.length?Math.max(...pms.map(m=>m.round))+1:0;
  real.forEach(m=>{
    if(m.isPool){m.phase=m.round-off;return}
    m.phase=2*m.depth-(m.tab.early?1:0);
    if(m.triGroup)m.phase=Math.max(m.phase,3);
  });
  const last={};
  const trioNext={};
  let triCount=0;
  let t=start;
  [...new Set(real.map(m=>m.phase))].sort((a,b)=>a-b).forEach(ph=>{
    const ms=real.filter(m=>m.phase===ph).sort((x,y)=>x.lo-y.lo||x.idx-y.idx);
    let ps=t;ms.forEach(m=>{ps=m.isPool?Math.max(ps,(last[m.a]??-1e9)+rest,(last[m.b]??-1e9)+rest):Math.max(ps,ready(m.sa)??start,ready(m.sb)??start)});
    let end=ps;
    let ci=0;
    ms.forEach(m=>{
      if(m.triGroup){
        // Poule à 3 : les 3 matchs partagent toujours une équipe deux à deux, donc jamais en parallèle.
        const base=Math.max(ps,ready(m.sa)??start,ready(m.sb)??start,trioNext[m.triGroup.lo]??-Infinity);
        m.time=D.times[m.id]!=null?D.times[m.id]:base;
        m.court=D.courts[m.id]!=null&&D.courts[m.id]<=C?D.courts[m.id]:(triCount%C)+1;
        triCount++;
        trioNext[m.triGroup.lo]=m.time+dur+rest;
        end=Math.max(end,m.time+dur);
        return;
      }
      const i=ci++;
      m.time=D.times[m.id]!=null?D.times[m.id]:ps+Math.floor(i/C)*dur;
      m.court=D.courts[m.id]!=null&&D.courts[m.id]<=C?D.courts[m.id]:(i%C)+1;
      end=Math.max(end,m.time+dur);
      if(m.isPool){last[m.a]=Math.max(last[m.a]??-1e9,m.time+dur);last[m.b]=Math.max(last[m.b]??-1e9,m.time+dur)}
    });
    t=end;
  });
  real.slice().sort((x,y)=>x.time-y.time||x.court-y.court).forEach((m,i)=>m.num=i+1);
  // Créneaux proposés : horaires déjà utilisés + heure où un terrain se libère après chaque match (durée d'un match)
  const slots=(()=>{const set=new Set([start]);
    real.forEach(x=>{set.add(x.time);set.add(x.time+dur)});
    return[...set].sort((a,b)=>a-b)})();
  places.forEach(p=>{p.pair=res(p.src);p.bye=isBye(p.src)});
  const rhi=(lo,hi)=>lo+places.filter(p=>!p.bye&&p.place>=lo&&p.place<=hi).length-1;
  tabs.forEach(t=>{t.rhi=rhi(t.lo,t.hi);t.rounds.forEach(r=>r.rhi=rhi(r.lo,r.lo+r.n-1))});
  list.forEach(m=>m.rhi=rhi(m.lo,m.lo+m.n-1));
  // Places des paires éliminées en poule, après celles du tableau final
  const poolPlaces=[];let nxt=places.filter(p=>!p.bye).length+1;
  if(D.pools){const maxN=Math.max(...D.pools.map(x=>x.length));
    for(let r=(D.qual||0)+1;r<=maxN;r++)stand.forEach((st,i)=>{if(D.pools[i].length>=r)poolPlaces.push({place:nxt++,pair:st.complete?st.rows[r-1].id:'',label:`${rankTxt(r)} poule ${LET(i)}`})})}
  const readyMatches=real.filter(x=>x.a&&x.b&&!x.winner&&!S.draw.started[x.id]).sort((a,b)=>a.time-b.time||a.court-b.court);
  const nextIds=new Set(readyMatches.slice(0,4).map(x=>x.id));
  return{M,list,real,tabs,places,pms,stand,poolPlaces,slots,nextIds};
}
function timeSelect(m,slots){
  return`<select data-tslot="${m.id}" aria-label="Heure M${m.num}">${slots.map(t=>`<option value="${t}" ${t===m.time?'selected':''}>${toHM(t)}</option>`).join('')}<option value="__other">Autre heure…</option></select>`;
}
const mainRound=n=>n===2?'Finale':n===4?'Demi-finales':n===8?'Quarts de finale':`1/${n/2}e de finale`;
const placesLabel=(lo,hi)=>hi<=lo?`${nth(lo)} place`:hi===lo+1?`${nth(lo)} et ${nth(hi)} places`:`Places ${lo} à ${hi}`;
const tabTitle=t=>t.main?'Tableau final':placesLabel(t.lo,t.rhi);
function origin(M,src){ // match réel dont provient une source encore inconnue
  let m=M[src.m],t=src.t;
  while(m.bye){const s=m.byeA?m.sb:m.sa;if(!s||s.p||s.tri)return null;if(s.q)return{q:s.q};t=s.t;m=M[s.m]}
  return{m,t};
}
function sideLabel(M,m,s){
  const id=m[s];if(id)return esc(label(byId(id)));
  if(id===null)return'<span class="tbd">Exempt</span>';
  const sq=s==='a'?m.sa:m.sb;if(sq&&sq.q)return`<span class="tbd">${rankTxt(sq.q[1])} poule ${LET(sq.q[0])}</span>`;
  const o=origin(M,s==='a'?m.sa:m.sb);
  if(o&&o.q)return`<span class="tbd">${rankTxt(o.q[1])} poule ${LET(o.q[0])}</span>`;
  return`<span class="tbd">${o?(o.t==='w'?'Vainqueur':'Perdant')+' M'+o.m.num:'À déterminer'}</span>`;
}
function oppText(M,m,pid){
  const s=m.a===pid?'b':'a';if(m[s])return label(byId(m[s]));
  const sq=s==='a'?m.sa:m.sb;if(sq&&sq.q)return`le ${rankTxt(sq.q[1])} de la poule ${LET(sq.q[0])}`;
  const o=origin(M,s==='a'?m.sa:m.sb);if(!o)return'à déterminer';
  if(o.q)return`le ${rankTxt(o.q[1])} de la poule ${LET(o.q[0])}`;
  const who=o.t==='w'?'le vainqueur':'le perdant';
  return o.m.a&&o.m.b?`${who} du match ${label(byId(o.m.a))} contre ${label(byId(o.m.b))}`:`${who} du match M${o.m.num}`;
}

}

function poolControls(n){
  const c=poolCfg(n),num=(k,v,min,max,l)=>`<label class="f">${l}<input type="number" min="${min}" max="${max}" data-set="${k}" value="${v}"></label>`;
  return`${num('pnum',c.P,1,16,'Nombre de poules')}${num('pqual',c.Q,1,4,'Qualifiés par poule')}${num('pdirect',c.X,0,n,'Paires directes au tableau')}

function scVal(scores,setIdx,sideIdx){
  let rows;
  if(Array.isArray(scores))rows=scores;
  else if(typeof scores==='string'&&scores)rows=scores.trim().split(/\s+/).map(s=>s.split('/'));
  else return'';
  const row=rows[setIdx];
  return row?(row[sideIdx]||''):'';
}
function matchBox(Mo,m,showBye){
  const seedNo=id=>{const k=S.draw.seeds.indexOf(id);return k>=0?`<span class="ts" data-tsid="${id}" title="Double-clic pour modifier">TS${k+1}</span>`:''};
  if(m.bye){
    const id=m.byeA?m.b:m.a,s=m.byeA?'b':'a';
    return`<div class="match bye ${showBye?'':'ghostm'}"><div class="mmain"><div class="meta"><span class="mnum">Exempt</span><span></span></div>
      <div class="siderow"><div class="side win" ${id?`data-pid="${id}"`:''} style="cursor:default"><span class="nm">${id?seedNo(id):''}${sideLabel(Mo.M,m,s)}</span></div></div>
      <div class="siderow"><div class="side"><span class="nm tbd">Exempt</span></div></div>
    </div></div>`;
  }
  const can=m.a&&m.b,C=Number(S.settings.courts)||1,F=fmt();
  const scores=S.draw.scores[m.id];

  return`<div class="match ${stateClass}">

      <select data-court="${m.id}" aria-label="Terrain M${m.num}">${Array.from({length:C},(_,i)=>`<option value="${i+1}" ${m.court===i+1?'selected':''}>T${i+1}</option>`).join('')}</select>
      ${timeSelect(m,Mo.slots)}</span></div>
    ${['a','b'].map((s,si)=>{const id=m[s];return`<div class="siderow"><button class="side ${m.winner&&m.winner===id?'win':''}" ${can?`data-win="${m.id}"`:'aria-disabled="true" tabindex="-1"'} ${id?`data-pid="${id}" title="${esc(label(byId(id)))}"`:''}><span class="nm">${id?seedNo(id):''}${sideLabel(Mo.M,m,s)}</span></button>${F.sets.map((_,ki)=>`<input class="score-side" inputmode="numeric" ${can?`data-sc="${m.id}|${ki}|${si}" value="${esc(scVal(scores,ki,si))}"`:'disabled'} aria-label="M${m.num} set ${ki+1} ${s==='a'?'A':'B'}">`).join('')}</div>`}).join('')}
    </div>
  </div>`;
}
function tabBlock(Mo,t,sub){
  if(t.triangular)return triBlock(Mo,t,sub);
  const rounds=t.rounds.filter(r=>t.main||r.matches.some(m=>!m.bye));
  const last=rounds.length-1;
  const inner=`<div class="bracket">
    ${rounds.map((r,ri)=>{
      const vis=m=>!m.bye||(t.main&&ri===0);
      const pairs=[];for(let i=0;i<r.matches.length;i+=2)pairs.push(r.matches.slice(i,i+2));
      const rl=t.main?mainRound(r.n):placesLabel(r.lo,r.rhi);
      return`<div class="round">${sub&&rounds.length===1?'':`<h3>${rl}</h3>`}<div class="ms">
      ${pairs.map(pr=>{
        const v=pr.map(vis);let pc='';
        if(ri<last&&pr.length===2)pc=v[0]&&v[1]?'v2':v[0]?'vt':v[1]?'vb':'';
        return`<div class="pair ${pc}">${pr.map((m,k)=>`<div class="mw ${v[k]&&ri<last?'cout':''} ${v[k]&&ri>0?'cin':''}">${matchBox(Mo,m,v[k])}</div>`).join('')}</div>`;
      }).join('')}</div></div>`}).join('')}
  </div>`;
  return sub?`<div class="subtab"><h3 class="subtitle">${tabTitle(t)}</h3>${inner}</div>`:`<section class="card"><h2>${tabTitle(t)}</h2>${inner}</section>`;
}
function triBlock(Mo,trio,sub){

    <div class="scroll"><table class="stand"><thead><tr><th>#</th><th>Paire</th><th class="num">V</th><th class="num">D</th><th class="num">Sets</th><th class="num">Jeux</th></tr></thead><tbody>

}
function branchBlock(Mo,t,members){

function classementLayout(Mo,cls,groups){
  const find=lo=>cls.find(t=>t.lo===lo);
  const hasReal=t=>t&&(t.triangular?t.matches.length>0:t.rounds.some(r=>r.matches.some(m=>!m.bye)));
  const t9=find(9),t13=find(13),t15=find(15),t11=find(11),t5=find(5),t3=find(3),t7=find(7);
  if(![t9,t13,t15,t11,t5,t3,t7].every(hasReal))return null;
  const custom=`<section class="card"><div class="branch">
    <div class="group">
      ${tabBlock(Mo,t9,true)}
      ${tabBlock(Mo,t13,true)}
      <div class="group">${tabBlock(Mo,t15,true)}${tabBlock(Mo,t11,true)}</div>
    </div>
    <div class="group">
      ${tabBlock(Mo,t5,true)}
      ${tabBlock(Mo,t3,true)}
      ${tabBlock(Mo,t7,true)}
    </div>
  </div></section>`;
  const skipRoots=new Set([t9,t5,t3]);
  const rest=groups.filter(([g])=>!skipRoots.has(g)).map(([g,ms])=>groupBlock(Mo,g,ms)).join('');
  return custom+rest;
}

        <div class="acts">${p.p.map((j,k)=>{const key=p.id+'-'+k;
          if(!j.tel)return`<span class="muted">${esc(j.prenom)} : pas de numéro</span>`;
          const sms=`<a class="btn sms icon-sm" target="_top" data-sent="${key}-conv" href="${smsHref(j.tel,message(Mo,p,k,m,'sms'))}" title="SMS convocation ${esc(j.prenom)}">${ICON_PHONE}${esc(j.prenom)}</a>${S.sent[key+'-conv']?'<span class="sent">envoyée</span>':''}`;
          const relance=`<a class="btn relance icon-sm" target="_top" data-sent="${key}-relance" href="${smsHref(j.tel,message(Mo,p,k,m,'relance'))}" title="SMS relance ${esc(j.prenom)}">${ICON_BELL}${esc(j.prenom)}</a>${S.sent[key+'-relance']?'<span class="sent">envoyée</span>':''}`;
          return sms+relance}).join('')}</div>
      </div>`}).join('')}`}).join('');
    })()}
  </section>
  <section class="card noprint">
    <h2>Message de convocation SMS</h2>
    <p class="help">Variables : {prenom} {partenaire} {tournoi} {date} {jour} {heure} (heure d'arrivée, ${s.early} min avant le match) {match} (heure du match) {piste} {adversaire}</p>
    <textarea data-set="tplSms">${esc(s.tplSms)}</textarea>
    ${exM?`<div class="preview" style="margin-top:12px"><div class="muted" style="font-size:13px;margin-bottom:4px">Exemple</div>${esc(message(Mo,ex,0,exM,'sms'))}</div>`:''}
  </section>
  <section class="card noprint">
    <h2>Message de convocation SMS groupé</h2>
    <p class="help">Envoyé au 1er joueur de chaque équipe d'un même créneau, en un seul SMS à plusieurs destinataires. Variables disponibles : {tournoi} {date} {jour} {heure} (heure d'arrivée du créneau). Pas de {prenom}/{adversaire}/{piste} puisque le message part à plusieurs équipes différentes.</p>
    <textarea data-set="tplSmsGroup">${esc(s.tplSmsGroup)}</textarea>
    ${exM?`<div class="preview" style="margin-top:12px"><div class="muted" style="font-size:13px;margin-bottom:4px">Exemple</div>${esc(groupMessage(exM.time-(Number(s.early)||0)))}</div>`:''}
  </section>
  <section class="card noprint">
    <h2>Message de relance SMS</h2>
    <p class="help">Envoyé individuellement, pour les équipes qui n'ont pas confirmé leur venue. Mêmes variables que le message de convocation.</p>
    <textarea data-set="tplRelance">${esc(s.tplRelance)}</textarea>
    ${exM?`<div class="preview" style="margin-top:12px"><div class="muted" style="font-size:13px;margin-bottom:4px">Exemple</div>${esc(message(Mo,ex,0,exM,'relance'))}</div>`:''}
  </section>`;
}
function message(Mo,p,k,m,ch){
  const s=S.settings,me=p.p[k],mate=p.p[1-k];
  const tpl=ch==='relance'?(s.tplRelance||TPL_RELANCE):(s.tplSms||TPL_SMS);
  return tpl
    .replaceAll('{prenom}',me.prenom).replaceAll('{partenaire}',`${mate.prenom} ${cap(mate.nom)}`)
    .replaceAll('{tournoi}',s.name).replaceAll('{date}',dateFR(s.date)).replaceAll('{jour}',dayFR(s.date))
    .replaceAll('{heure}',toHM(m.time-(Number(s.early)||0))).replaceAll('{match}',toHM(m.time)).replaceAll('{piste}','T'+m.court)
    .replaceAll('{adversaire}',oppText(Mo.M,m,p.id));
}

function bind(){
  const q=(s,f)=>document.querySelectorAll(s).forEach(f);
  q('[data-set]',el=>el.onchange=()=>{const k=el.dataset.set;let v=el.type==='number'?Number(el.value):el.value;
    if(k==='start'){const t=parseHM(v);if(t==null){UI.err='Heure invalide. Exemple : 9h00';render();return}v=toHM(t)}
    S.settings[k]=v;save();render()});
  q('[data-act="event"]',el=>el.onchange=()=>{S.event=el.value;S.draw=null;save();render()});
  q('[data-act="format"]',el=>el.onchange=()=>{const f=FORMATS[el.value];Object.assign(S.settings,{format:el.value,dur:f.dur,rest:f.rest});save();render()});
  q('[data-out]',el=>el.onchange=()=>{if(el.checked)delete S.out[el.dataset.out];else S.out[el.dataset.out]=1;save();render()});
  q('[data-confirmed]',el=>el.onchange=()=>{if(el.checked)S.confirmed[el.dataset.confirmed]=1;else delete S.confirmed[el.dataset.confirmed];save();render()});
  q('[data-paid]',el=>el.onchange=()=>{if(el.checked)S.paid[el.dataset.paid]=1;else delete S.paid[el.dataset.paid];save();render()});
  q('[data-editpair]',el=>el.onclick=()=>{UI.editPair=UI.editPair===el.dataset.editpair?null:el.dataset.editpair;render()});
  q('[data-canceledit]',el=>el.onclick=()=>{UI.editPair=null;render()});
  q('[data-savepair]',el=>el.onclick=()=>{
    const id=el.dataset.savepair,pair=S.all.find(x=>x.id===id);
    if(!pair){UI.editPair=null;render();return}
    document.querySelectorAll(`[data-ef^="${id}|"]`).forEach(inp=>{
      const[,k,field]=inp.dataset.ef.split('|');let v=inp.value.trim();
      if(field==='tel')v=normTel(v);
      else if(field==='cl')v=v?Number(v):null;
      else if(field==='nom')v=v.toUpperCase();
      else if(field==='prenom')v=cap(v);
      pair.p[k][field]=v;
    });
    pair.poids=(Number(pair.p[0].cl)||99999)+(Number(pair.p[1].cl)||99999);
    UI.editPair=null;save();render();
  });
  q('[data-win]',el=>el.onclick=()=>{clearTimeout(winTimer);winTimer=setTimeout(()=>{const id=el.dataset.win,p=el.dataset.pid;const set=S.draw.winners[id]!==p;S.draw.winners[id]=set?p:'';if(set)S.draw.started[id]=1;save();render()},260)});
  q('[data-score]',el=>el.onchange=()=>{
    const id=el.dataset.score,D=S.draw,{sets,txt}=parseScore(el.value);
    D.scores[id]=txt;const m=model().M[id],w=autoWin(sets);
    if(w)D.winners[id]=m[w];
    save();const key=id;render();
    const L=[...document.querySelectorAll('[data-score]')],k=L.findIndex(e=>e.dataset.score===key);
    if(k>=0&&L[k+1]&&document.activeElement===document.body)L[k+1].focus();
  });
  q('[data-tstep]',el=>el.onclick=()=>{const[id,st]=el.dataset.tstep.split('|');S.draw.times[id]=Math.max(0,Number(el.dataset.cur)+Number(st));save();render();const b=document.querySelector(`[data-tstep="${el.dataset.tstep}"]`);if(b)b.focus()});
  q('[data-time]',el=>el.addEventListener('keydown',e=>{if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;e.preventDefault();const t=(parseHM(el.value)??0)+(e.key==='ArrowUp'?5:-5);S.draw.times[el.dataset.time]=t;save();render();const n=document.querySelector(`[data-time="${el.dataset.time}"]`);if(n){n.focus();n.select()}}));
  q('[data-sc]',el=>el.onchange=()=>{
    const [id,i,si]=el.dataset.sc.split('|');const D=S.draw;
    if(!Array.isArray(D.scores[id]))D.scores[id]=[];const sc=D.scores[id];
    sc[i]=sc[i]||['',''];sc[i][si]=el.value.trim();
    const m=model().M[id],w=autoWin(sc);
    if(w&&D.winners[id]!==m[w]){D.winners[id]=m[w];D.started[id]=1;save();const key=el.dataset.sc;render();
      const L=[...document.querySelectorAll('[data-sc]')],k=L.findIndex(e=>e.dataset.sc===key);if(k>=0&&L[k+1])L[k+1].focus()}
    else save();
  });
  q('[data-time]',el=>el.onchange=()=>{const t=parseHM(el.value);if(t==null){UI.err='Heure invalide. Exemple : 14h15';render();return}S.draw.times[el.dataset.time]=t;save();render()});
  q('[data-tslot]',el=>el.onchange=()=>{
    const id=el.dataset.tslot;
    let newTime;
    if(el.value==='__other'){
      const cur=model().M[id];
      const x=prompt('Heure du match (ex. 14h15)',cur&&cur.time!=null?toHM(cur.time):'');
      if(x===null){render();return}
      newTime=parseHM(x);
      if(newTime==null){UI.err='Heure invalide. Exemple : 14h15';render();return}
    }else newTime=Number(el.value);
    const Mo=model(),m=Mo.M[id];
    if(!m){S.draw.times[id]=newTime;save();render();return}
    const oldTime=m.time;
    const conflict=Mo.real.find(x=>x.id!==id&&!x.bye&&x.court===m.court&&x.time===newTime);
    S.draw.times[id]=newTime;
    if(conflict)S.draw.times[conflict.id]=oldTime;
    save();render();
  });
  q('[data-court]',el=>el.onchange=()=>{
    const id=el.dataset.court,newCourt=Number(el.value)||1,Mo=model(),m=Mo.M[id];
    if(!m){S.draw.courts[id]=newCourt;save();render();return}
    const oldCourt=m.court;
    const conflict=Mo.real.find(x=>x.id!==id&&!x.bye&&x.time===m.time&&x.court===newCourt);
    S.draw.courts[id]=newCourt;
    if(conflict)S.draw.courts[conflict.id]=oldCourt;
    save();render();
  });
  q('[data-started]',el=>el.onchange=()=>{if(el.checked)S.draw.started[el.dataset.started]=1;else delete S.draw.started[el.dataset.started];save();render()});
  q('[data-sent]',el=>el.addEventListener('click',()=>{S.sent[el.dataset.sent]=1;save();setTimeout(render,300)}));
  const d=document.getElementById('draw');if(d)d.onclick=()=>{if(S.draw&&!UI.redraw){UI.redraw=1;render();return}UI.redraw=0;if(makeDraw()){S.tab='tableau';UI.ok='Nouveau tirage effectué.';window.scrollTo(0,0)}save();render()};
  const dc=document.getElementById('drawCancel');if(dc)dc.onclick=()=>{UI.redraw=0;render()};
  const rt=document.getElementById('resetTimes');if(rt)rt.onclick=()=>{S.draw.times={};S.draw.courts={};save();render()};
  const pb=document.getElementById('pdfBtn');if(pb)pb.onclick=()=>exportPDF(pb);
  document.querySelectorAll('.ts[data-tsid]').forEach(el=>{
    el.addEventListener('click',e=>e.stopPropagation());
    el.addEventListener('dblclick',e=>{e.preventDefault();e.stopPropagation();clearTimeout(winTimer);editSeed(el.dataset.tsid)});
  });
  document.querySelectorAll('.side[data-pid]').forEach(el=>{
    const pid=el.dataset.pid;
    if(!pid)return;
    el.draggable=true;
    el.addEventListener('dblclick',e=>{e.preventDefault();clearTimeout(winTimer);editSeed(pid)});
    el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',pid);e.dataTransfer.effectAllowed='move'});
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('dragover')});
    el.addEventListener('dragleave',()=>el.classList.remove('dragover'));
    el.addEventListener('drop',e=>{
      e.preventDefault();el.classList.remove('dragover');
      const src=e.dataTransfer.getData('text/plain');
      if(src&&src!==pid){swapPairs(src,pid);render()}
    });
  });
  const rs=document.getElementById('reset');if(rs)rs.onclick=()=>{if(!UI.reset){UI.reset=1;render();return}UI.reset=0;const keep=S.settings;S=fresh();S.settings=keep;save();render()};
  const ar=document.getElementById('archive');if(ar)ar.onclick=()=>{if(!UI.archive){UI.archive=1;render();return}UI.archive=0;archiveTournament()};
  const dt=document.getElementById('delTourn');if(dt)dt.onclick=()=>{if(!UI.delTourn){UI.delTourn=1;render();return}UI.delTourn=0;removeCurrentTournament('Tournoi supprimé.')};
  const la=document.getElementById('loadArchives');if(la)la.onclick=()=>loadArchives();
  q('[data-arcview]',el=>el.onclick=()=>{UI.archiveOpen=UI.archiveOpen===el.dataset.arcview?null:el.dataset.arcview;render()});
  const f=document.getElementById('file');if(f)f.onchange=()=>f.files[0]&&importFile(f.files[0]);
  const dr=document.getElementById('drop');
  if(dr){dr.ondragover=e=>{e.preventDefault();dr.classList.add('over')};dr.ondragleave=()=>dr.classList.remove('over');
    dr.ondrop=e=>{e.preventDefault();dr.classList.remove('over');const x=e.dataTransfer.files[0];if(x)importFile(x)}}
}
async function exportPDF(btn){
  if(!window.jspdf||!window.html2canvas){UI.err='Le module PDF ne s\'est pas chargé. Vérifiez la connexion puis rechargez la page.';render();return}
  btn.disabled=true;btn.textContent='Création du PDF…';
  const s=S.settings;
  const wrap=document.createElement('div');wrap.id='pdfwrap';
  wrap.innerHTML=`<div class="ph"><img src="${LOGO}" alt=""><div><h1>${esc(s.name)}</h1><div>${esc(S.event)}, ${esc(dateFR(s.date))}</div></div></div>`;
  const app=document.getElementById('app').cloneNode(true);
  app.querySelectorAll('.noprint,.msg').forEach(e=>e.remove());
  app.querySelectorAll('select').forEach(e=>{const sp=document.createElement('span');sp.textContent=e.options[e.selectedIndex]?.text||'';e.replaceWith(sp)});
  app.querySelectorAll('input').forEach(e=>{const d=document.createElement('div');d.className='score score-p';d.textContent=e.value||'\u00a0';e.replaceWith(d)});
  app.querySelectorAll('button').forEach(e=>{const d=document.createElement('div');d.className=e.className;d.innerHTML=e.innerHTML;e.replaceWith(d)});
  wrap.append(...app.childNodes);document.body.appendChild(wrap);
  try{
    if(document.fonts)await document.fonts.ready;
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    const W=297,H=210,Mg=10;
    const grp=(...els)=>{const d=document.createElement('div');els[0].before(d);d.append(...els);return d};
    function fitScale(naturalH,gap,pageH){
      const total=naturalH.reduce((a,h)=>a+h,0)+gap*Math.max(0,naturalH.length-1);
      function pagesNeeded(sc){
        let yy=0,pages=1;
        for(let i=0;i<naturalH.length;i++){
          let h=Math.min(naturalH[i]*sc,pageH);
          if(yy+h>pageH&&yy>0){pages++;yy=0}
          yy+=h+gap*sc;
        }
        return pages;
      }
      let scale=Math.min(1,pageH/total);
      for(let i=0;i<40&&pagesNeeded(scale)>1;i++)scale*=0.94;
      return scale;
    }
    async function drawBlocks(blocksEls){
      const fullW=W-2*Mg,pageH=H-2*Mg,gap=4;
      const canvases=[];
      for(const b of blocksEls)canvases.push(await html2canvas(b,{scale:3,backgroundColor:'#ffffff',logging:false}));
      const naturalH=canvases.map(c=>c.height*fullW/c.width);
      const scale=fitScale(naturalH,gap,pageH);
      const heights=naturalH.map(h=>Math.min(h*scale,pageH));
      const contentH=heights.reduce((a,h)=>a+h,0);
      const slots=heights.length+1;
      const spacing=Math.max(0,(pageH-contentH)/slots);
      let y=Mg+spacing;
      for(let i=0;i<canvases.length;i++){
        const c=canvases[i];
        const h=heights[i];
        let w=naturalH[i]*scale>pageH?c.width*h/c.height:fullW*scale;
        const x=Mg+(fullW-w)/2;
        pdf.addImage(c.toDataURL('image/jpeg',0.95),'JPEG',x,y,w,h);y+=h+spacing;
      }
    }
    wrap.querySelector('#classementFinal')?.remove();
    const mainDiv=wrap.querySelector('#tableauPrincipal');
    const clsDiv=wrap.querySelector('#tableauClassement');
    await drawBlocks([grp(wrap.querySelector('.ph'),mainDiv)]);
    if(clsDiv){
      pdf.addPage();
      const sect=clsDiv.querySelector('h2.sect');
      const clsCards=[...clsDiv.querySelectorAll(':scope > section.card')];
      const page2=sect&&clsCards.length?[grp(sect,clsCards[0]),...clsCards.slice(1)]:clsCards;
      await drawBlocks(page2);
    }
    const name=`${(s.name||'tournoi').replace(/[^\w-]+/g,'-')}-tableaux.pdf`;
    let dl=null;try{dl=await window.claude?.use?.('downloads')}catch(e){}
    if(dl){try{await dl.save({filename:name,data:pdf.output('arraybuffer')});UI.ok='PDF enregistré.'}catch(e){if(e.code!=='declined')UI.err='Impossible d\'enregistrer le PDF ici.'}}
    else pdf.save(name);
  }catch(e){UI.err='La création du PDF a échoué.'}
  wrap.remove();render();
}
